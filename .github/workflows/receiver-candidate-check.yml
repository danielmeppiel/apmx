name: Receiver Candidate Check

# Unprivileged gate for the enterprise-receiver demo.
#
# This MUST run as pull_request_target, not pull_request: for pull_request,
# GitHub loads this workflow's own YAML *and* every file it executes (this
# file, check.py, evidence-requirements.txt) from the PR's own tree, so any
# PR could silently replace them with something that always exits 0 while
# keeping the same required-check name. pull_request_target loads the
# workflow definition from the BASE ref, so it is pinned below with an
# explicit `ref:` -- never implicit/default. The untrusted PR head is never
# checked out or executed: its objects are fetched (not checked out) in a
# separate step purely so check.py can read specific candidate bytes via
# `git show <head_sha>:<path>` for hashing/diffing, matching the PR's
# trust model in docs/security-story.md. No secrets are used and
# `contents: read` is the only permission granted.

on:
  pull_request_target:
    branches:
      - "examples/enterprise-receiver"

permissions:
  contents: read

concurrency:
  group: receiver-candidate-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Receiver Candidate Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Pin the checkout -- and therefore every file this job reads or
          # executes as code -- to the PR's trusted BASE commit, never the
          # PR's own tree. Full history so check.py's trusted-ref reads and
          # the merge-base computation below work regardless of how many
          # commits separate base/head on examples/enterprise-receiver.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch untrusted PR head objects (never checked out or executed)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # This only transfers git objects into the local store; it does
          # not check them out or run anything. refs/pull/<N>/head always
          # exists on the base repo for same-repo and fork PRs alike.
          git fetch --no-tags --prune --no-recurse-submodules origin \
            "refs/pull/${PR_NUMBER}/head"
          # Defense in depth: confirm the fetched tip really is the exact
          # commit GitHub's event payload named, not something that moved
          # out from under us between event dispatch and this fetch.
          git cat-file -e "${HEAD_SHA}^{commit}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install independent evidence verifier
        run: |
          set -euo pipefail
          python3 -m venv .venv-evidence
          .venv-evidence/bin/python -m pip install --quiet --upgrade pip
          .venv-evidence/bin/python -m pip install --quiet -r scripts/evidence-requirements.txt

      - name: Fetch pinned evidence schemas (offline afterwards)
        run: |
          set -euo pipefail
          .venv-evidence/bin/python - "$PWD/.schema-cache" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          from urllib.request import urlopen

          sys.path.insert(0, "scripts")
          import verify_evidence as ve

          cache = Path(sys.argv[1])
          cache.mkdir(parents=True, exist_ok=True)
          for name, expected in ve.SCHEMAS.items():
              url = f"https://raw.githubusercontent.com/CycloneDX/specification/{ve.SCHEMA_COMMIT}/schema/{name}"
              with urlopen(url, timeout=30) as response:
                  raw = response.read(2 * 1024 * 1024)
              digest = hashlib.sha256(raw).hexdigest()
              assert digest == expected, f"schema hash mismatch for {name}: {digest}"
              (cache / name).write_bytes(raw)
              print(f"fetched {name}")
          PY

      - name: Run receiver checks for every case in this PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          mapfile -t case_dirs < <(
            git diff --diff-filter=A --name-only "$merge_base" "$HEAD_SHA" -- \
              'examples/enterprise-receiver/cases/*' |
              sed -E 's#^(examples/enterprise-receiver/cases/[^/]+)/.*#\1#' |
              sort -u
          )
          if [ "${#case_dirs[@]}" -eq 0 ]; then
            echo "::error::No examples/enterprise-receiver/cases/<name> directory was added by this PR"
            exit 1
          fi
          status=0
          for case_dir in "${case_dirs[@]}"; do
            case_name="$(basename "$case_dir")"
            echo "::group::case: $case_name"
            .venv-evidence/bin/python examples/enterprise-receiver/receiver/check.py \
              check-case \
              --case "$case_name" \
              --case-dir "$case_dir" \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --schemas "$PWD/.schema-cache" \
              || status=1
            echo "::endgroup::"
          done
          exit "$status"
