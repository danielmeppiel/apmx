name: Temporary public lock bootstrap

# Remove after the hosted lock and its manifest identity have been verified.
on:
  push:
    branches: [danielmeppiel-standalone-apmx]
    paths:
      - .github/workflows/lock-bootstrap.yml
      - pyproject.toml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_CONFIG: "true"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Resolve the public lock without installing the application
        run: uv lock --default-index https://pypi.org/simple
      - name: Bind returned lock bytes to the checked-out manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = Path("pyproject.toml").read_bytes()
          committed_manifest = subprocess.check_output(["git", "show", "HEAD:pyproject.toml"])
          if commit != os.environ["GITHUB_SHA"] or manifest != committed_manifest:
              raise SystemExit("Checkout or manifest changed during lock bootstrap")
          evidence = {
              "schema": "apmx-lock-bootstrap/1",
              "commit": commit,
              "pyproject_sha256": hashlib.sha256(manifest).hexdigest(),
              "uv_lock_sha256": hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest(),
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "index": "https://pypi.org/simple",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path("lock-bootstrap-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(evidence, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lock-bootstrap-${{ github.sha }}
          path: |
            uv.lock
            lock-bootstrap-evidence.json
          if-no-files-found: error
          retention-days: 7
