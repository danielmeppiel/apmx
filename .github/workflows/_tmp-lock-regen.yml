name: Temp lock regen

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_VERSION: "0.11.26"
      UV_NO_CONFIG: "true"
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned dependency manager from the public index
        run: python -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple "uv==$UV_VERSION"
      - name: Regenerate lock
        run: uv lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-lock
          path: uv.lock
          retention-days: 1
