name: Receiver Evidence Attestation

# Privileged signing boundary for the enterprise-receiver demo. This workflow
# never checks out or executes a pull request head; it only runs for pushes
# to the trusted examples/enterprise-receiver base branch (or an explicit
# manual dispatch), over evidence already committed to that trusted tree. It
# has no access to any candidate's working tree and performs no candidate
# checking itself -- that is receiver-candidate-check.yml's unprivileged job.
#
# Same three-job, artifact-bridged pipeline as receiver-candidate-check.yml,
# so the ONLY job holding id-token:write/attestations:write (sign) never
# shares a runner or workspace with the job that actually executes the
# canonical evidence's candidate bytes:
#
#   prepare (job A) -- contents:read only, re-derives every digest, writes
#     the execution bundle for job B.
#   execute (job B) -- permissions: {}, NO checkout, runs ONLY the one
#     trusted file job A shipped it (container/run_bundle.py) inside a
#     disposable, digest-pinned, network-isolated container.
#   sign (job C) -- contents:read + id-token:write + attestations:write.
#     Independently re-derives pass/fail from job B's raw observations
#     (never trusts its booleans), runs the SAME factory-allowlist and
#     capability-revocation policy checks the unprivileged job runs
#     (reused from receiver/check.py's assess_canonical, not duplicated),
#     and only then builds and signs the predicate. The candidate's own
#     code NEVER runs in this job, nor in any job holding signing
#     credentials -- only job B (permissions: {}) ever executes it, inside
#     the sandbox described above.
#
# The signature this workflow produces authenticates one claim only: "this
# exact CI assessment workflow ran its full policy assessment -- including
# the receiver-required behavioral execution check -- against this exact
# evidence package and it was accepted". It is not a SLSA build-provenance
# claim about the underlying candidate code, it is not a per-PR binding
# claim (binding only applies to a specific candidate PR, and is the
# unprivileged job's responsibility), and it does not retroactively
# authenticate any local/offline agent execution.

on:
  push:
    branches:
      - "examples/enterprise-receiver"
    paths:
      - "examples/enterprise-receiver/fixtures/approved-evidence/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PREDICATE_TYPE: "https://danielmeppiel.dev/apmx/receiver-ci-assessment/v1"
  EVIDENCE_DIR: examples/enterprise-receiver/fixtures/approved-evidence
  BUNDLE_ARTIFACT: receiver-attest-bundle-${{ github.run_id }}
  RESULTS_ARTIFACT: receiver-attest-results-${{ github.run_id }}

jobs:
  prepare:
    name: Receiver Evidence Attestation / prepare (job A)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install independent evidence verifier
        run: |
          set -euo pipefail
          python3 -m venv .venv-evidence
          .venv-evidence/bin/python -m pip install --quiet --upgrade pip
          .venv-evidence/bin/python -m pip install --quiet -r scripts/evidence-requirements.txt

      - name: Fetch pinned evidence schemas (offline afterwards)
        run: |
          set -euo pipefail
          .venv-evidence/bin/python - "$PWD/.schema-cache" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          from urllib.request import urlopen

          sys.path.insert(0, "scripts")
          import verify_evidence as ve

          cache = Path(sys.argv[1])
          cache.mkdir(parents=True, exist_ok=True)
          for name, expected in ve.SCHEMAS.items():
              url = f"https://raw.githubusercontent.com/CycloneDX/specification/{ve.SCHEMA_COMMIT}/schema/{name}"
              with urlopen(url, timeout=30) as response:
                  raw = response.read(2 * 1024 * 1024)
              digest = hashlib.sha256(raw).hexdigest()
              assert digest == expected, f"schema hash mismatch for {name}: {digest}"
              (cache / name).write_bytes(raw)
          PY

      - name: Prepare the execution bundle for the canonical evidence package
        run: |
          set -euo pipefail
          .venv-evidence/bin/python examples/enterprise-receiver/receiver/check.py \
            prepare-canonical \
            --evidence-dir "$EVIDENCE_DIR" \
            --base-sha "${{ github.sha }}" \
            --schemas "$PWD/.schema-cache" \
            --bundle-dir bundle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.BUNDLE_ARTIFACT }}
          path: bundle/
          retention-days: 1
          if-no-files-found: error

  execute:
    name: Receiver Evidence Attestation / execute (job B, zero permissions)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      # Deliberately NO actions/checkout step and NO access to any signing
      # credential: this job's entire code is the one trusted file job A
      # placed in the bundle (run_bundle.py). The canonical evidence's
      # candidate bytes are executed here, and ONLY here -- never in the
      # signing job below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.BUNDLE_ARTIFACT }}
          path: bundle/

      - name: Execute the canonical evidence's candidate inside an isolated container
        run: |
          set -euo pipefail
          python3 bundle/run_bundle.py --bundle-dir bundle --results results.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.RESULTS_ARTIFACT }}
          path: results.json
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Receiver Evidence Attestation / sign (job C)
    needs: [prepare, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install independent evidence verifier
        run: |
          set -euo pipefail
          python3 -m venv .venv-evidence
          .venv-evidence/bin/python -m pip install --quiet --upgrade pip
          .venv-evidence/bin/python -m pip install --quiet -r scripts/evidence-requirements.txt

      - name: Fetch pinned evidence schemas (offline afterwards, independently)
        run: |
          set -euo pipefail
          .venv-evidence/bin/python - "$PWD/.schema-cache" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          from urllib.request import urlopen

          sys.path.insert(0, "scripts")
          import verify_evidence as ve

          cache = Path(sys.argv[1])
          cache.mkdir(parents=True, exist_ok=True)
          for name, expected in ve.SCHEMAS.items():
              url = f"https://raw.githubusercontent.com/CycloneDX/specification/{ve.SCHEMA_COMMIT}/schema/{name}"
              with urlopen(url, timeout=30) as response:
                  raw = response.read(2 * 1024 * 1024)
              digest = hashlib.sha256(raw).hexdigest()
              assert digest == expected, f"schema hash mismatch for {name}: {digest}"
              (cache / name).write_bytes(raw)
          PY

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.BUNDLE_ARTIFACT }}
          path: bundle/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.RESULTS_ARTIFACT }}
          path: results-download/

      - name: Run the receiver's full policy assessment before signing
        id: assess
        run: |
          set -euo pipefail
          result="$(.venv-evidence/bin/python examples/enterprise-receiver/receiver/check.py \
            assess-canonical \
            --evidence-dir "$EVIDENCE_DIR" \
            --base-sha "${{ github.sha }}" \
            --schemas "$PWD/.schema-cache" \
            --bundle-dir bundle \
            --results results-download/results.json)"
          echo "$result"
          status="$(echo "$result" | .venv-evidence/bin/python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "accepted" ]; then
            echo "::error::Receiver policy assessment rejected the canonical evidence; refusing to sign."
            exit 1
          fi
          definition_sha256="$(echo "$result" | .venv-evidence/bin/python -c 'import json,sys; print(json.load(sys.stdin)["definitionSha256"])')"
          echo "definition_sha256=${definition_sha256}" >> "$GITHUB_OUTPUT"

      - name: Write the assessment receipt for the gate job (even on rejection)
        if: always()
        run: |
          set -euo pipefail
          python3 -c '
          import json
          json.dump({"accepted": "${{ steps.assess.outcome }}" == "success"}, open("receipt.json", "w"))
          '

      - name: Upload the assessment receipt for the gate job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receiver-attest-receipt-${{ github.run_id }}
          path: receipt.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Build the signed predicate from the actual assessment result
        id: predicate
        env:
          DEFINITION_SHA256: ${{ steps.assess.outputs.definition_sha256 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg assessedBy "receiver-attest.yml" \
            --arg assessment "accepted" \
            --arg definitionSha256 "$DEFINITION_SHA256" \
            '{assessedBy: $assessedBy, assessment: $assessment,
              assessedChecks: ["integrity", "factory", "capability-revocation", "execution"],
              definitionSha256: $definitionSha256}' \
            > predicate.json
          cat predicate.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.EVIDENCE_DIR }}/index.json
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: predicate.json

  gate:
    # The ACTUAL required status check, if/when this workflow is ever wired
    # to a branch-protection rule -- never `sign` directly. Same fail-closed
    # `if: always()` rationale as receiver-candidate-check.yml's gate job:
    # a downstream job skipped because its own `needs:` upstream job failed
    # is reported as "skipped", which GitHub branch protection treats as
    # SATISFYING a required check, not blocking it.
    name: Receiver Evidence Attestation / gate (required)
    if: always()
    needs: [prepare, execute, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: receiver-attest-receipt-${{ github.run_id }}
          path: receipt/
        continue-on-error: true

      - name: Evaluate the fail-closed gate
        run: |
          set -euo pipefail
          python3 examples/enterprise-receiver/receiver/gate.py \
            --job-result "prepare=${{ needs.prepare.result }}" \
            --job-result "execute=${{ needs.execute.result }}" \
            --job-result "sign=${{ needs.sign.result }}" \
            --receipt receipt/receipt.json

