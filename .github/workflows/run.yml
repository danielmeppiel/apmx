name: apmx run

# Run a factory in CI and sign its receipt, with the agent kept away from the
# checks of record, from the signing identity and from any write token:
#
#   target   no agent: resolves the base commit. With target-repository (the
#            central factory platform model) it fetches that repository at
#            its base with the target credential and hands the tree on as
#            an artifact, so the agent's job never receives the credential.
#   produce  the agent runs (`apmx FACTORY`). No id-token, read-only token.
#            Its own checks are only a fast fail; its receipt is untrusted.
#   check    a fresh runner, no agent: `apmx check` replays only the output
#            bytes into this commit's factory, reruns its checks and writes the
#            receipt of record (receipt.intoto.jsonl; harness and models are
#            recorded as reported by the producer). It uploads the receipt
#            (apmx-receipt) and a code-only delivery (apmx-delivery): the
#            delivered files at their repository paths plus .apmx-deleted.
#   attest   id-token + attestations: write, no caller checkout, no candidate
#            code: `apmx audit --offline`, then GitHub artifact attestations
#            over the delivered files: a SLSA VSA v1 binding every receipt
#            statement by digest, and the receipt bundle. A PR then carries
#            code only: `apmx audit` finds both by a changed file's SHA-256.
#   deliver  only with target-repository; no agent, no candidate code: pushes
#            the delivered files onto the base commit as a branch of the
#            target repository and opens or updates its pull request, using
#            a GitHub App token scoped to that one repository.
#
# Caller:
#   jobs:
#     factory:
#       uses: danielmeppiel/apmx/.github/workflows/run.yml@v0.7.1
#       with: { factory: path/to/factory, checks-requirements: checks/requirements.txt }
#   or, for a factory package run against the caller's repository:
#       with: { factory: "owner/factory#v1", checks-requirements: checks/requirements.txt }
#       permissions: { contents: read, id-token: write, attestations: write }
#       secrets: { agent-token: ${{ secrets.COPILOT_TOKEN }} }
#   or, from a factory platform repository, against another repository
#   (examples/factory-platform):
#       with: { factory: "acme/checkout-factory#v1.0.0", target-repository: acme/shop,
#               target-app-client-id: "${{ vars.FACTORY_APP_CLIENT_ID }}" }
#       secrets: { agent-token: ..., target-app-private-key: ${{ secrets.FACTORY_APP_KEY }} }

on:
  workflow_call:
    inputs:
      factory:
        description: >
          Factory directory in the caller's repository, or an APM package
          reference pinned to a tag or commit (owner/repo[/path]#ref), run
          against `workspace` like `apmx --from`.
        type: string
        default: "."
      workspace:
        description: >
          Caller directory a package factory runs against: its inputs and
          evidence root. Ignored for a local factory directory.
        type: string
        default: "."
      harness:
        description: Agent CLI (copilot or opencode); it must be installable on ubuntu-24.04.
        type: string
        default: copilot
      model:
        description: Model passed to the agent CLI; empty for its default.
        type: string
        default: ""
      apmx-version:
        description: apmx release to install, or "source" to build apmx-ref (apmx's own CI).
        type: string
        default: "0.7.1"
      apmx-ref:
        description: >
          Ref of danielmeppiel/apmx providing the setup and attest actions. The
          default is this release's tag; keep it equal to the run.yml ref you call.
        type: string
        default: v0.7.1
      attest:
        description: Sign the receipt of record. Needs id-token and attestations write.
        type: boolean
        default: true
      checks-requirements:
        description: >
          Optional pip requirements file inside the factory or factory package
          (for example checks/requirements.txt): the factory's own approved checker
          dependencies. Installed into a fresh virtualenv whose python3 runs
          the checks, in the produce and check jobs only, never in attest.
          Hashes are required when the file has any.
        type: string
        default: ""
      hermetic-actor:
        description: apmx CI only. Replace the agent CLI with the hermetic protocol fixture.
        type: boolean
        default: false
      request:
        description: >
          Optional request text written to `request-file` in the run root (the
          factory directory or package workspace) before the factory runs, in
          the produce and check jobs. It is prompt input: treat it as untrusted.
        type: string
        default: ""
      request-file:
        description: Path, inside the run root, that `request` is written to.
        type: string
        default: request.md
      target-repository:
        description: >
          Central factory platform: owner/name of the repository the factory runs
          against and delivers a pull request to. `factory` must then be a pinned
          package reference and `workspace` a directory of that repository. Empty
          (the default): the caller's own repository, no deliver job.
        type: string
        default: ""
      target-ref:
        description: >
          Branch, tag or commit of target-repository to build on; empty for its
          default branch. The pull request targets this branch, or the default
          branch when it is a tag or commit.
        type: string
        default: ""
      target-branch:
        description: >
          Branch the deliver job force-pushes in target-repository; an open pull
          request from it is updated. Never the base or default branch. Empty:
          apmx/run-<run id>.
        type: string
        default: ""
      deliver:
        description: >
          pull-request (push target-branch, open or update its pull request),
          branch (push only) or bundle (no push, no token: the delivered commit
          is only uploaded as the apmx-delivered git bundle, for a caller job
          that pushes it itself). Every mode uploads that bundle.
        type: string
        default: pull-request
      target-app-client-id:
        description: >
          Client ID of the GitHub App installed on target-repository. The target
          and deliver jobs mint their own installation tokens, scoped to that one
          repository: contents read (target), contents and pull-requests write
          (deliver).
        type: string
        default: ""
    secrets:
      agent-token:
        description: Token for the agent CLI (COPILOT_GITHUB_TOKEN). Seen only by the produce job.
        required: false
      target-app-private-key:
        description: Private key of that GitHub App. Seen only by the target and deliver jobs.
        required: false
      target-token:
        description: >
          Alternative to the App: a token for target-repository (contents and
          pull-requests write), for example the caller's GITHUB_TOKEN when the
          target is the caller's own repository. Seen only by the target and
          deliver jobs.
        required: false
    outputs:
      definition-sha256:
        description: Factory definition digest of the receipt of record.
        value: ${{ jobs.check.outputs.definition }}
      receipt-sha256:
        description: SHA-256 of the receipt of record (receipt.intoto.jsonl).
        value: ${{ jobs.check.outputs.receipt }}
      attestation-url:
        description: URL of the signed verification summary (empty when attest is off).
        value: ${{ jobs.attest.outputs.url }}
      base-commit:
        description: Commit of the base repository the factory ran against.
        value: ${{ jobs.target.outputs.commit }}
      delivered-commit:
        description: Commit the deliver job built on the base (platform mode; pushed unless deliver is bundle).
        value: ${{ jobs.deliver.outputs.commit }}
      pull-request-url:
        description: Pull request the deliver job opened or updated (platform mode).
        value: ${{ jobs.deliver.outputs.pull-request-url }}

permissions: {}

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.base.outputs.repository }}
      commit: ${{ steps.base.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - id: split
        name: Validate the target repository
        if: inputs.target-repository != ''
        env:
          TARGET: ${{ inputs.target-repository }}
        run: |
          if [[ ! "$TARGET" =~ ^([A-Za-z0-9][A-Za-z0-9-]*)/([A-Za-z0-9._-]+)$ || "$TARGET" == *..* ]]; then
            echo "::error::target-repository must be owner/name: $TARGET"
            exit 1
          fi
          { echo "owner=${BASH_REMATCH[1]}"; echo "name=${BASH_REMATCH[2]}"; } >> "$GITHUB_OUTPUT"
      - id: app
        name: Read-only token for the target repository
        if: inputs.target-repository != '' && inputs.target-app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.target-app-client-id }}
          private-key: ${{ secrets.target-app-private-key }}
          owner: ${{ steps.split.outputs.owner }}
          repositories: ${{ steps.split.outputs.name }}
          permission-contents: read
      - if: inputs.target-repository != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.target-repository }}
          ref: ${{ inputs.target-ref }}
          token: ${{ steps.app.outputs.token || secrets.target-token || github.token }}
          path: target
          persist-credentials: false
      - id: base
        name: Resolve the base commit (and ship the target tree, without credentials)
        env:
          TARGET: ${{ inputs.target-repository }}
        run: |
          if [[ -n "$TARGET" ]]; then
            commit=$(git -C target rev-parse HEAD)
            tar --exclude=./.git -cf "$RUNNER_TEMP/target.tar" -C target .
          else
            TARGET=$GITHUB_REPOSITORY
            commit=$GITHUB_SHA
          fi
          { echo "repository=$TARGET"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          echo "Base: $TARGET@$commit"
      - if: inputs.target-repository != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apmx-target
          path: ${{ runner.temp }}/target.tar
          if-no-files-found: error
          retention-days: 1

  produce:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - if: inputs.target-repository == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: caller
          persist-credentials: false
      - if: inputs.target-repository != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apmx-target
          path: ${{ runner.temp }}/target
      - name: Unpack the target repository at its base commit (no .git, no credentials)
        if: inputs.target-repository != ''
        run: mkdir caller && tar -xf "$RUNNER_TEMP/target/target.tar" -C caller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: danielmeppiel/apmx
          ref: ${{ inputs.apmx-ref }}
          path: apmx
          persist-credentials: false
      - if: inputs.apmx-version != 'source'
        uses: ./apmx/.github/actions/setup
        with:
          version: ${{ inputs.apmx-version }}
      - if: inputs.apmx-version == 'source'
        uses: ./apmx/.github/actions/setup-from-source
        with:
          path: apmx
      - name: Hermetic agent (no model calls)
        if: inputs.hermetic-actor
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' \
            "$GITHUB_WORKSPACE/apmx/scripts/fixtures/copilot_actor.py" > "$RUNNER_TEMP/agent/copilot"
          chmod +x "$RUNNER_TEMP/agent/copilot"
          echo "$RUNNER_TEMP/agent" >> "$GITHUB_PATH"
          {
            echo "APMX_ACTOR_LOG=$RUNNER_TEMP/actor.jsonl"
            echo "APMX_ACTOR_MODE=pass"
            echo "APMX_ACTOR_CREDENTIALS=$RUNNER_TEMP/agent-credentials.jsonl"
          } >> "$GITHUB_ENV"
      - name: Install the Copilot CLI
        if: ${{ !inputs.hermetic-actor && inputs.harness == 'copilot' }}
        run: npm install --global --no-fund --no-audit @github/copilot
      - name: Stage the factory out of the Git checkout
        # apmx refuses native runs inside a Git repository with remotes (fail-closed
        # no-policy prerequisite), so it runs from a plain copy: the factory
        # directory, or the workspace a package factory runs against.
        env:
          FACTORY: ${{ inputs.factory }}
          WORKSPACE: ${{ inputs.workspace }}
          TARGET: ${{ inputs.target-repository }}
          BASE_REPOSITORY: ${{ needs.target.outputs.repository }}
          BASE_COMMIT: ${{ needs.target.outputs.commit }}
        run: |
          python3 apmx/scripts/run_stage.py stage --caller caller --factory "$FACTORY" \
            --workspace "$WORKSPACE" --base-repository "$BASE_REPOSITORY" \
            --base-commit "$BASE_COMMIT" ${TARGET:+--target}
      - name: Write the request into the run root
        if: inputs.request != ''
        env:
          REQUEST: ${{ inputs.request }}
          REQUEST_FILE: ${{ inputs.request-file }}
        run: python3 apmx/scripts/run_stage.py request --file "$REQUEST_FILE"
      - if: inputs.checks-requirements != '' && inputs.apmx-version != 'source'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the factory's check requirements
        if: inputs.checks-requirements != ''
        env:
          REQUIREMENTS: ${{ inputs.checks-requirements }}
        run: python3 apmx/scripts/run_stage.py requirements --file "$REQUIREMENTS"
      - name: Run the factory (agent; untrusted outputs)
        working-directory: ${{ runner.temp }}
        env:
          HARNESS: ${{ inputs.harness }}
          MODEL: ${{ inputs.model }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.agent-token }}
        run: |
          if [[ -n "$APMX_FACTORY_REF" ]]; then
            cd "$APMX_RUN_ROOT"
            args=(--from "$APMX_FACTORY_REF")
          else
            args=("$APMX_RUN_ROOT")
          fi
          args+=(--on "$HARNESS" --allow-host-access --allow-unproven-inputs)
          if [[ -n "$MODEL" ]]; then args+=(--model "$MODEL"); fi
          apmx "${args[@]}"
      - name: Collect the producer receipt
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          found = sorted(Path(os.environ["APMX_RUN_ROOT"], ".apm").glob("*/*/receipt.intoto.jsonl"),
                         key=lambda p: p.parent.name)
          if not found:
              raise SystemExit("The factory run delivered no receipt")
          target = Path(os.environ["RUNNER_TEMP"]) / "producer-receipt"
          target.mkdir()
          shutil.copyfile(found[-1], target / "receipt.intoto.jsonl")
          shutil.copytree(found[-1].parent / "evidence", target / "evidence")
          PY
      - name: Self-test, the agent saw no credential besides the model token
        if: inputs.hermetic-actor
        env:
          TARGET: ${{ inputs.target-repository }}
        run: |
          python3 apmx/scripts/run_stage.py credentials --log "$APMX_ACTOR_CREDENTIALS" \
            --caller caller ${TARGET:+--target}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apmx-producer-receipt
          path: ${{ runner.temp }}/producer-receipt
          if-no-files-found: error
          retention-days: 7

  check:
    needs: [target, produce]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      definition: ${{ steps.record.outputs.definition }}
      receipt: ${{ steps.record.outputs.receipt }}
      prefix: ${{ steps.record.outputs.prefix }}
    defaults:
      run:
        shell: bash
    steps:
      - if: inputs.target-repository == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: caller
          persist-credentials: false
      - if: inputs.target-repository != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apmx-target
          path: ${{ runner.temp }}/target
      - name: Unpack the target repository at its base commit (no .git, no credentials)
        if: inputs.target-repository != ''
        run: mkdir caller && tar -xf "$RUNNER_TEMP/target/target.tar" -C caller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: danielmeppiel/apmx
          ref: ${{ inputs.apmx-ref }}
          path: apmx
          persist-credentials: false
      - if: inputs.apmx-version != 'source'
        uses: ./apmx/.github/actions/setup
        with:
          version: ${{ inputs.apmx-version }}
      - if: inputs.apmx-version == 'source'
        uses: ./apmx/.github/actions/setup-from-source
        with:
          path: apmx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apmx-producer-receipt
          path: ${{ runner.temp }}/producer-receipt
      - name: Stage the factory out of the Git checkout
        # apmx refuses native runs inside a Git repository with remotes (fail-closed
        # no-policy prerequisite), so it runs from a plain copy: the factory
        # directory, or the workspace a package factory runs against.
        env:
          FACTORY: ${{ inputs.factory }}
          WORKSPACE: ${{ inputs.workspace }}
          TARGET: ${{ inputs.target-repository }}
          BASE_REPOSITORY: ${{ needs.target.outputs.repository }}
          BASE_COMMIT: ${{ needs.target.outputs.commit }}
        run: |
          python3 apmx/scripts/run_stage.py stage --caller caller --factory "$FACTORY" \
            --workspace "$WORKSPACE" --base-repository "$BASE_REPOSITORY" \
            --base-commit "$BASE_COMMIT" ${TARGET:+--target}
      - name: Write the request into the run root
        if: inputs.request != ''
        env:
          REQUEST: ${{ inputs.request }}
          REQUEST_FILE: ${{ inputs.request-file }}
        run: python3 apmx/scripts/run_stage.py request --file "$REQUEST_FILE"
      - if: inputs.checks-requirements != '' && inputs.apmx-version != 'source'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the factory's check requirements
        if: inputs.checks-requirements != ''
        env:
          REQUIREMENTS: ${{ inputs.checks-requirements }}
        run: python3 apmx/scripts/run_stage.py requirements --file "$REQUIREMENTS"
      - name: Re-check the outputs here (no agent) and write the receipt of record
        working-directory: ${{ runner.temp }}
        run: |
          if [[ -n "$APMX_FACTORY_REF" ]]; then
            cd "$APMX_RUN_ROOT"
            apmx check "$RUNNER_TEMP/producer-receipt" --from "$APMX_FACTORY_REF"
          else
            apmx check "$RUNNER_TEMP/producer-receipt" "$APMX_RUN_ROOT"
          fi
      - name: The installed check requirements are the factory definition's own
        if: inputs.checks-requirements != ''
        env:
          REQUIREMENTS: ${{ inputs.checks-requirements }}
        run: |
          receipt=$(ls "$APMX_RUN_ROOT"/.apm/*/*/receipt.intoto.jsonl)
          python3 apmx/scripts/run_stage.py verify --receipt "$receipt" --file "$REQUIREMENTS"
      - id: record
        name: Package the receipt of record and a code-only delivery
        run: python3 apmx/scripts/run_stage.py package --output "$RUNNER_TEMP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apmx-receipt
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apmx-delivery
          path: ${{ runner.temp }}/delivery
          include-hidden-files: true
          if-no-files-found: error

  attest:
    needs: check
    if: inputs.attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: danielmeppiel/apmx
          ref: ${{ inputs.apmx-ref }}
          path: apmx
          persist-credentials: false
      - if: inputs.apmx-version != 'source'
        uses: ./apmx/.github/actions/setup
        with:
          version: ${{ inputs.apmx-version }}
      - if: inputs.apmx-version == 'source'
        uses: ./apmx/.github/actions/setup-from-source
        with:
          path: apmx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apmx-receipt
          path: ${{ runner.temp }}/receipt
      - id: attest
        uses: ./apmx/.github/actions/attest
        with:
          receipt: ${{ runner.temp }}/receipt/receipt.intoto.jsonl
          prefix: ${{ needs.check.outputs.prefix }}

  deliver:
    needs: [target, check, attest]
    if: >-
      ${{ inputs.target-repository != '' && !cancelled() && needs.check.result == 'success'
      && (needs.attest.result == 'success' || !inputs.attest) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.deliver.outputs.commit }}
      pull-request-url: ${{ steps.deliver.outputs.pull-request-url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: danielmeppiel/apmx
          ref: ${{ inputs.apmx-ref }}
          path: apmx
          persist-credentials: false
      - id: split
        name: Split the target repository
        env:
          TARGET: ${{ needs.target.outputs.repository }}
        run: |
          { echo "owner=${TARGET%%/*}"; echo "name=${TARGET#*/}"; } >> "$GITHUB_OUTPUT"
      - id: app
        name: Write token for the target repository only
        if: inputs.target-app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.target-app-client-id }}
          private-key: ${{ secrets.target-app-private-key }}
          owner: ${{ steps.split.outputs.owner }}
          repositories: ${{ steps.split.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apmx-delivery
          path: ${{ runner.temp }}/delivery
      - id: deliver
        name: Push the delivered files and open or update the pull request (runs no candidate code)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.target-token }}
          TARGET: ${{ needs.target.outputs.repository }}
          TARGET_REF: ${{ inputs.target-ref }}
          BASE_COMMIT: ${{ needs.target.outputs.commit }}
          BRANCH: ${{ inputs.target-branch }}
          DELIVER: ${{ inputs.deliver }}
          FACTORY: ${{ inputs.factory }}
          DEFINITION: ${{ needs.check.outputs.definition }}
          ATTESTATION_URL: ${{ needs.attest.outputs.url }}
          RECEIPT_SHA256: ${{ needs.check.outputs.receipt }}
        run: |
          python3 apmx/scripts/run_deliver.py deliver --delivery "$RUNNER_TEMP/delivery" \
            --bundle "$RUNNER_TEMP/delivered/delivered.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apmx-delivered
          path: ${{ runner.temp }}/delivered
          if-no-files-found: error
