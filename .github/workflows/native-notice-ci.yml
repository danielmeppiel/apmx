name: Notice-complete native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.26"
  UV_NO_CONFIG: "true"
  UV_DEFAULT_INDEX: https://pypi.org/simple
  UV_PYTHON_DOWNLOADS: never

jobs:
  # TEMPORARY: regenerates uv.lock on a runner with full internet access
  # (this fork's local dev sandbox cannot reach files.pythonhosted.org).
  # Remove this job once the regenerated uv.lock is committed.
  lock_regen_temp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned dependency manager from the public index
        run: python -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple "uv==$UV_VERSION"
      - name: Regenerate lock
        run: uv lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-lock-regen
          path: uv.lock
          retention-days: 1

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.project.outputs.matrix }}
      version: ${{ steps.project.outputs.version }}
      sha: ${{ steps.project.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: project
        name: Validate standalone interface and native-notice prerequisites
        run: python scripts/release.py validate --require-native-notices

  native:
    needs: validate
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned dependency manager from the public index
        run: python -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple "uv==$UV_VERSION"
      - name: Bind dependency and native tools to the selected interpreter
        env:
          SELECTED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          echo "UV_PYTHON=$SELECTED_PYTHON" >> "$GITHUB_ENV"
          echo "APMX_BUILD_PYTHON=$SELECTED_PYTHON" >> "$GITHUB_ENV"
      - name: Install the frozen public lock and optional factory test tools
        run: uv sync --frozen --extra dev --extra build --extra factory --extra tui
      - name: Provision the genuine pinned native APM backend for source tests
        id: backend
        run: uv run --frozen --extra dev --extra build --extra factory python scripts/release.py provision-apm --target "$TARGET" --output dist/apm-backend
      - name: Run unit, source-free built-wheel and infrastructure tests
        env:
          APMX_APM_BACKEND: ${{ steps.backend.outputs.backend }}
        run: uv run --frozen --extra dev --extra build --extra factory --extra tui python -m pytest tests/unit tests/release -q --basetemp "$RUNNER_TEMP/source-tests"
      - name: Build native Windows hermetic protocol actor
        if: runner.os == 'Windows'
        run: uv run --frozen --extra dev --extra build python scripts/smoke.py --build-actor dist/smoke-actor
      - name: Freeze application and bundle the verified official APM backend
        id: build
        run: uv run --frozen --extra dev --extra build --extra tui python scripts/release.py build --target "$TARGET"
      - name: Verify checksum and safely extract outside the checkout
        id: extract
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: python scripts/release.py extract --archive "$ARCHIVE" --destination "$RUNNER_TEMP/frozen-bundle"
      - name: Exercise real bundled APM installs, selected imports and independent checks
        env:
          BUNDLE: ${{ steps.extract.outputs.bundle }}
        run: |
          args=()
          executable=apmx
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable=apmx.exe
            args+=(--actor "$GITHUB_WORKSPACE/dist/smoke-actor/copilot.exe")
          fi
          python scripts/smoke.py --binary "$BUNDLE/$executable" --version "$VERSION" \
            --report "$RUNNER_TEMP/build-smoke.json" "${args[@]}"
      - name: Retain notice-verified candidate archives and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apmx-${{ matrix.target }}
          path: dist/assets/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain frozen acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/build-smoke.json
          if-no-files-found: error
          retention-days: 7
