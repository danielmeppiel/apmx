name: Attest an apmx receipt
description: >
  Sign an apmx receipt of record with GitHub artifact attestations (Sigstore,
  keyless). The receipt is first audited with `apmx audit --offline`, and
  complete evidence is required; only a VALID receipt is signed. Two
  attestations are created over the delivered files: a SLSA Verification
  Summary v1 that binds every receipt statement by the SHA-256 of its bundle
  line, and the bundle itself, so `apmx audit` can fetch the statements by a
  file's digest and a PR needs no receipt file. Run it in a job that runs no
  agent and no candidate code: it needs `id-token: write` and
  `attestations: write`. Requires apmx on PATH
  (danielmeppiel/apmx/.github/actions/setup).
inputs:
  receipt:
    description: Path to receipt.intoto.jsonl (with evidence/ next to it).
    required: true
  prefix:
    description: >
      The repository directory the delivered files belong under (the run's
      workspace); empty for the repository root.
    required: false
    default: ""
  github-token:
    description: Token used by actions/attest.
    required: false
    default: ${{ github.token }}
outputs:
  definition-sha256:
    description: Factory definition digest the summary names as its policy.
    value: ${{ steps.predicate.outputs.definition }}
  attestation-id:
    description: ID of the verification summary attestation.
    value: ${{ steps.summary.outputs.attestation-id }}
  attestation-url:
    description: URL of the verification summary attestation.
    value: ${{ steps.summary.outputs.attestation-url }}
runs:
  using: composite
  steps:
    - id: predicate
      shell: bash
      env:
        RECEIPT: ${{ inputs.receipt }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        python="$(command -v python3 || command -v python)"
        "$python" "$GITHUB_ACTION_PATH/predicate.py" summary "$RECEIPT" --prefix "$PREFIX" \
          --output "$RUNNER_TEMP/apmx-attest"
    - id: bundle
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.predicate.outputs.subjects }}
        predicate-type: https://github.com/danielmeppiel/apmx/attestation/receipt-bundle/v2
        predicate-path: ${{ steps.predicate.outputs.bundle }}
        github-token: ${{ inputs.github-token }}
    - id: summary
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.predicate.outputs.subjects }}
        predicate-type: https://slsa.dev/verification_summary/v1
        predicate-path: ${{ steps.predicate.outputs.predicate }}
        github-token: ${{ inputs.github-token }}
