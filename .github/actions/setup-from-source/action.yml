name: Set up apmx from source (apmx CI only)
description: >
  Install apmx from a source checkout plus the pinned, verified APM backend.
  Used by apmx's own CI to exercise run.yml before a release exists.
  Consumers use ../setup, which installs a verified release archive.
inputs:
  path:
    description: Path to a danielmeppiel/apmx checkout.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - id: install
      shell: bash
      env:
        TOOLING: ${{ inputs.path }}
      run: |
        python -m pip install --disable-pip-version-check --quiet "$TOOLING"
        python "$TOOLING/scripts/release.py" provision-apm --target linux-x86_64 \
          --output "$RUNNER_TEMP/apm-backend"
    - shell: bash
      env:
        BACKEND: ${{ steps.install.outputs.backend }}
      run: |
        echo "APMX_APM_BACKEND=$BACKEND" >> "$GITHUB_ENV"
        apmx --version
