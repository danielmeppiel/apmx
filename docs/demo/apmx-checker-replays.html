<script>
const capture=JSON.parse(document.getElementById("capture").textContent);
const terminal=document.getElementById("terminal");
document.getElementById("title").textContent=capture.title;
let timers=[];
document.getElementById("play").onclick=()=>{
  timers.forEach(clearTimeout);timers=[];terminal.textContent="";
  for(const [time,kind,text] of capture.events){
    timers.push(setTimeout(()=>{terminal.textContent+=text;terminal.scrollTop=terminal.scrollHeight},time*1000));
  }
};
terminal.textContent=capture.events.map(event=>event[2]).join("");
</script></html>
